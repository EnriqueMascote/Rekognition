name: CI

on:
  pull_request:
    branches: [develop, release, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup runtime placeholder
        run: echo "Configure runtime according to project stack"

      - name: Install dependencies placeholder
        run: echo "Install dependencies"

      - name: Lint placeholder
        run: echo "Run linter"

      - name: Format check placeholder
        run: echo "Run formatter check"

      - name: Unit tests placeholder
        run: echo "Run unit tests"

      - name: Integration tests placeholder
        run: echo "Run integration tests"

      - name: Build placeholder
        run: echo "Build project"
